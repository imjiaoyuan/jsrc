<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Heart Curve</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
body { display: flex; flex-direction: column; }
#topbar { display: flex; align-items: center; gap: 20px; padding: 10px 16px 8px; flex-shrink: 0; }
#controls { display: flex; gap: 8px; flex-shrink: 0; }
.btn {
  padding: 5px 18px; border: 1.5px solid #CD5555; background: #fff8f8;
  color: #CD5555; font-size: 13px; border-radius: 8px; cursor: pointer;
  transition: background 0.12s, box-shadow 0.12s; user-select: none;
}
.btn:hover { background: #ffe4e4; box-shadow: 0 2px 6px rgba(205,85,85,0.2); }
.btn:active { background: #ffd0d0; }
#formula { font-size: 15px; color: #444; letter-spacing: 0.03em; white-space: nowrap; }
#av { color: #CD5555; font-weight: 700; font-variant-numeric: tabular-nums; }
canvas { flex: 1; display: block; width: 100%; }
#botbar { display: flex; align-items: center; gap: 10px; padding: 6px 16px 10px; flex-shrink: 0; }
.slabel { font-size: 12px; color: #aaa; min-width: 24px; font-variant-numeric: tabular-nums; }
#aslider { flex: 1; accent-color: #CD5555; cursor: pointer; }
</style>
</head>
<body>

<div id="topbar">
  <div id="controls">
    <button class="btn" id="btn-play">&#9654;&#xFE0E;&ensp;Play</button>
    <button class="btn" id="btn-pause">&#9646;&#9646;&ensp;Pause</button>
  </div>
  <div id="formula">f(x) = &#x221B;(x&sup2;) + 0.9&thinsp;&sdot;&thinsp;&radic;(3.3&minus;x&sup2;)&thinsp;&sdot;&thinsp;sin(<span id="av">1.00</span>&thinsp;&pi;x)</div>
</div>

<canvas id="c"></canvas>

<div id="botbar">
  <span class="slabel" style="text-align:right">1</span>
  <input type="range" id="aslider" min="1" max="20" step="0.01" value="1">
  <span class="slabel" id="sval">1.00</span>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const X0=-3, X1=3, Y0=-2, Y1=4;
const PAD = {t:12, r:16, b:28, l:44};

function resize() { canvas.width=canvas.offsetWidth; canvas.height=canvas.offsetHeight; }

function toC(dx, dy) {
  const w=canvas.width-PAD.l-PAD.r, h=canvas.height-PAD.t-PAD.b;
  return [PAD.l+(dx-X0)/(X1-X0)*w, PAD.t+(1-(dy-Y0)/(Y1-Y0))*h];
}

function drawGrid() {
  ctx.strokeStyle='#e8d8d8'; ctx.lineWidth=1;
  for (let gx=X0; gx<=X1; gx++) {
    const [px]=toC(gx,0),[,py0]=toC(0,Y0),[,py1]=toC(0,Y1);
    ctx.beginPath(); ctx.moveTo(px,py1); ctx.lineTo(px,py0); ctx.stroke();
  }
  for (let gy=Y0; gy<=Y1; gy++) {
    const [,py]=toC(0,gy),[px0]=toC(X0,0),[px1]=toC(X1,0);
    ctx.beginPath(); ctx.moveTo(px0,py); ctx.lineTo(px1,py); ctx.stroke();
  }
}

function drawAxes() {
  ctx.strokeStyle='#c8a0a0'; ctx.lineWidth=1.5;
  const [ax0]=toC(X0,0),[ax1]=toC(X1,0),[,ay]=toC(0,0);
  ctx.beginPath(); ctx.moveTo(ax0,ay); ctx.lineTo(ax1,ay); ctx.stroke();
  const [,ay0]=toC(0,Y0),[,ay1]=toC(0,Y1),[ax]=toC(0,0);
  ctx.beginPath(); ctx.moveTo(ax,ay0); ctx.lineTo(ax,ay1); ctx.stroke();
  ctx.fillStyle='#bbb'; ctx.font='11px sans-serif'; ctx.textAlign='center';
  for (let gx=X0; gx<=X1; gx++) {
    if (gx===0) continue;
    const [px]=toC(gx,0); ctx.fillText(gx,px,ay+16);
  }
  ctx.textAlign='right';
  for (let gy=Y0; gy<=Y1; gy++) {
    if (gy===0) continue;
    const [,py]=toC(0,gy); ctx.fillText(gy,ax-6,py+4);
  }
}

const N=720;
const xs=Array.from({length:N},(_,i)=>-1.8+i*3.6/(N-1));

function drawCurve(a) {
  ctx.strokeStyle='#CD5555'; ctx.lineWidth=2.5; ctx.lineJoin='round';
  ctx.beginPath(); let first=true;
  for (const x of xs) {
    const inner=3.3-x*x;
    const y=Math.cbrt(x*x)+(inner>0?0.9*Math.sqrt(inner)*Math.sin(a*Math.PI*x):0);
    const [px,py]=toC(x,y);
    if (first){ctx.moveTo(px,py);first=false;}else ctx.lineTo(px,py);
  }
  ctx.stroke();
}

function draw(a) { ctx.clearRect(0,0,canvas.width,canvas.height); drawGrid(); drawAxes(); drawCurve(a); }

let alpha=1, playing=false, raf=null, t0=null;
const SPEED=2.5;

function update(a, noSlider) {
  alpha=Math.max(1,Math.min(20,a));
  draw(alpha);
  const s=alpha.toFixed(2);
  document.getElementById('av').textContent=s;
  document.getElementById('sval').textContent=s;
  if (!noSlider) document.getElementById('aslider').value=alpha;
}

function tick(ts) {
  if (!playing) return;
  if (t0!==null) {
    alpha+=SPEED*(ts-t0)/1000;
    if (alpha>=20) { playing=false; update(20,false); return; }
    update(alpha,false);
  }
  t0=ts;
  raf=requestAnimationFrame(tick);
}

document.getElementById('btn-play').onclick=()=>{
  if (playing) return;
  if (alpha>=20) alpha=1;
  playing=true; t0=null; raf=requestAnimationFrame(tick);
};
document.getElementById('btn-pause').onclick=()=>{
  playing=false; if(raf)cancelAnimationFrame(raf); t0=null;
};
document.getElementById('aslider').oninput=e=>update(+e.target.value,true);

window.addEventListener('resize',()=>{resize();draw(alpha);});
resize(); draw(alpha);
</script>
</body>
</html>
