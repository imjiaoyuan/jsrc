[project]
name = "jsrc"
version = "0.2.8"
description = "Python library for bioinformatics and scientific computing"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Jiaoyuan", email = "imjiaoyuan@gmail.com"}
]

dependencies = [
    "biopython>=1.80",
    "numpy>=1.23",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
vision = ["opencv-python>=4.7", "matplotlib>=3.5"]
all = [
    "matplotlib>=3.5",
    "opencv-python>=4.7",
]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "black>=22.0", "ruff>=0.1", "mypy>=1.0"]

[project.scripts]
jsrc = "jsrc.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["jsrc*"]

[tool.setuptools.package-data]
"jsrc.grn" = ["sources/*"]
"jsrc.plot" = ["sources/*"]

[tool.black]
target-version = ["py310"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=jsrc --cov-report=html --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
disable_error_code = ["no-any-return", "arg-type", "type-var", "assignment", "operator", "return-value", "attr-defined"]
